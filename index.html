<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- LADO ESQUERDO (azul) -->
        <div class="lado-esquerdo">
            <img src="emdesalogo.JPG" alt="Logo do site" class="logo">
            <p>Venda e assistência técnica de computadores e notebooks.</p>
        </div>

        <!-- LADO DIREITO (preto) -->
        <div class="lado-direito">
            <div class="info-item">
                <div class="icone-circulo">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="info-texto">
                    <h2>Endereço</h2>
                    <p>Rua Minas Gerais, 1333, Centro<br>Divinópolis - MG</p>
                </div>
            </div>

            <div class="info-item">
                <div class="icone-circulo">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="info-texto">
                    <h2>Contato</h2>
                    <p>E-mail: emdesa@bol.com.br<br>WhatsApp:(37) 3934-0970</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
